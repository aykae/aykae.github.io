<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact</title>
    <meta name="description" content="Contact hi@aykae.com.">
    <style>
      :root { color-scheme: light; background: #f7f5ef; color: #34332f; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      a { color: inherit; font: 400 clamp(20px, 3vw, 28px)/1.5 Georgia, 'Times New Roman', serif; text-decoration: none; }
      a:hover { text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 1px; }
      a:focus-visible { outline: 1px solid currentColor; outline-offset: 8px; border-radius: 2px; }
    </style>
  </head>
  <body>
    <main>
      <a href="mailto:hi@aykae.com">hi@aykae.com</a>
    </main>
  </body>
</html>
